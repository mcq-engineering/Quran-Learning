<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Quran Learning & Recitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lateef&family=Nunito:wght@400;600;700;800;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


  <meta name="theme-color" content="#087F8C">
  <meta name="description" content="A joyful Quran reading and recitation app for kids.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kids Quran">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --primary: #087F8C;
      --primary-dark: #055B64;
      --primary-light: #0E9AA8;
      --secondary: #FFD166;
      --accent: #FF70A6;
      --bg-mint: #EFF8F6;
      --card-bg: #FFFFFF;
      --text-dark: #1D2D35;
      --text-muted: #5C707A;
      --gold-glow: #FFF8E7;
      --gold-border: #FFD166;
      --font-ui: 'Nunito', sans-serif;
      --font-arabic: 'Amiri', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background-color: var(--bg-mint);
      color: var(--text-dark);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    .app-header {
      background: var(--primary);
      color: white;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(8, 127, 140, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand i { font-size: 26px; color: var(--secondary); }
    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .star-badge {
      background-color: var(--primary-dark);
      color: var(--secondary);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .star-badge:hover { transform: scale(1.05); }

    .icon-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .icon-btn.active { color: var(--secondary); }


    .install-app-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      padding: 9px 13px; background: var(--secondary); color: #17464A;
      font: 800 13px var(--font-ui); cursor: pointer; white-space: nowrap;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }
    .install-app-btn:active { transform: scale(.98); }
    @media (max-width: 560px) {
      .app-header { padding: 10px 12px; gap: 8px; }
      .brand { gap: 7px; } .brand h1 { font-size: 18px; } .brand i { font-size: 22px; }
      .header-actions { gap: 5px; } .star-badge { padding: 6px 9px; font-size: 12px; }
      .install-app-btn { padding: 8px 10px; font-size: 12px; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-banner {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(8, 127, 140, 0.25);
      position: relative;
      overflow: hidden;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: var(--secondary);
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .hero-arabic {
      font-family: var(--font-arabic);
      font-size: 32px;
      direction: rtl;
      font-weight: bold;
      margin: 4px 0;
    }

    .hero-subtitle { font-size: 15px; font-weight: 600; opacity: 0.95; }

    .controls-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(5, 91, 100, 0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .segmented-control {
      display: flex;
      background: #EBF2F4;
      border-radius: 16px;
      padding: 4px;
      gap: 4px;
    }

    .segmented-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .segmented-btn.active {
      background: white;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .selector-row { display: flex; gap: 12px; flex-wrap: wrap; }

    .select-btn {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 2px solid #E2ECE9;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-dark);
      transition: border-color 0.2s;
    }
    .select-btn:hover { border-color: var(--primary); }

    .select-btn-info { display: flex; align-items: center; gap: 10px; }

    .badge-number {
      width: 30px;
      height: 30px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    .audio-hub {
      position: sticky;
      top: 70px;
      z-index: 900;
      background: var(--primary-dark);
      color: white;
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(5, 91, 100, 0.3);
    }

    .audio-hub-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .audio-info { display: flex; align-items: center; gap: 12px; }

    .audio-icon {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary);
      font-size: 18px;
    }

    .audio-text h4 { font-size: 14px; font-weight: 800; }
    .audio-text p { font-size: 12px; color: rgba(255, 255, 255, 0.75); }

    .audio-actions { display: flex; align-items: center; gap: 8px; }

    .play-main-btn {
      background: var(--secondary);
      color: var(--primary-dark);
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .play-main-btn:hover { transform: scale(1.08); background: #FFE082; }

    /* Recitation Speed Quick Strip */
    .speed-control-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 12px;
      padding: 6px 12px;
      gap: 10px;
    }

    .speed-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .speed-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .speed-chip {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .speed-chip.active {
      background: var(--secondary);
      color: var(--primary-dark);
    }

    .verses-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .verses-header h3 { font-size: 20px; font-weight: 800; color: var(--primary-dark); }

    .count-chip {
      background: rgba(8, 127, 140, 0.12);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
    }

    .ayah-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 12px;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .ayah-card.active-verse {
      background: var(--gold-glow) !important;
      border-color: var(--gold-border) !important;
      box-shadow: 0 6px 20px rgba(255, 209, 102, 0.4);
      transform: scale(1.01);
    }

    .ayah-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #F0F4F5;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .ayah-meta { display: flex; align-items: center; gap: 10px; }

    .ayah-number {
      width: 32px;
      height: 32px;
      background: rgba(8, 127, 140, 0.1);
      color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }

    .ayah-title { font-weight: 700; font-size: 14px; color: var(--text-dark); }

    .reciting-now-badge {
      display: none;
      background: var(--primary);
      color: white;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      align-items: center;
      gap: 4px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    .ayah-card.active-verse .reciting-now-badge { display: inline-flex; }

    .ayah-actions { display: flex; align-items: center; gap: 4px; }

    .ayah-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ayah-action-btn:hover { background: #F0F4F5; color: var(--primary); }
    .ayah-action-btn.bookmarked { color: #FF9F1C; }

    .arabic-text {
      font-family: var(--font-arabic);
      font-size: 28px;
      line-height: 2.2;
      text-align: right;
      direction: rtl;
      color: #172B2B;
      font-weight: 500;
      padding: 6px 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-card {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #EBF2F4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 18px; color: var(--primary-dark); }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #E2ECE9;
      border-radius: 14px;
      font-family: var(--font-ui);
      font-size: 15px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }

    .list-item {
      padding: 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }
    .list-item:hover { background: var(--bg-mint); }

    .setting-group { display: flex; flex-direction: column; gap: 6px; }
    .setting-group label { font-weight: 700; font-size: 14px; color: var(--text-dark); }

    select, input[type="range"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      font-family: var(--font-ui);
    }

    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 0;
      gap: 12px;
      color: var(--primary);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(8, 127, 140, 0.15);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand">
      <i class="fa-solid fa-book-quran"></i>
      <h1>Kids Quran</h1>
    </div>
    <div class="header-actions">
      <button class="install-app-btn" id="installAppBtn" type="button" onclick="installKidsQuran()" aria-label="Install Kids Quran app"><i class="fa-solid fa-download"></i><span>Install App</span></button>
      <div class="star-badge" id="starBadge" onclick="rewardStar()" title="Click for extra stars!">
        <i class="fa-solid fa-star"></i>
        <span id="starCount">12 Stars</span>
      </div>
      <button class="icon-btn" id="bookmarkFilterBtn" onclick="toggleBookmarksOnly()" title="Toggle Bookmarks">
        <i class="fa-solid fa-bookmark"></i>
      </button>
      <button class="icon-btn" onclick="openModal('settingsModal')" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <div class="container">
    <!-- Hero Banner -->
    <div class="hero-banner">
      <span class="hero-tag">🌟 Assalamu Alaikum, Little Scholar!</span>
      <div class="hero-arabic">السَّلَامُ عَلَيْكُمْ</div>
      <div class="hero-subtitle">Let’s read, listen, and memorize the Quran together!</div>
    </div>

    <!-- Mode & Selector Controls Card -->
    <div class="controls-card">
      <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between;">
        <div class="segmented-control" style="flex: 1; min-width: 200px;">
          <button class="segmented-btn active" id="modeSurahBtn" onclick="setSelectMode('surah')">
            <i class="fa-solid fa-book"></i> Surah
          </button>
          <button class="segmented-btn" id="modeJuzBtn" onclick="setSelectMode('juz')">
            <i class="fa-solid fa-layer-group"></i> Para / Juz
          </button>
        </div>

        <div class="segmented-control" style="flex: 1; min-width: 200px;">
          <button class="segmented-btn" id="playSingleBtn" onclick="setPlaybackMode('single')">Verse</button>
          <button class="segmented-btn active" id="playFullBtn" onclick="setPlaybackMode('full')">Full Recitation</button>
        </div>
      </div>

      <div class="selector-row">
        <button class="select-btn" id="surahPickerBtn" onclick="openModal('surahModal')">
          <div class="select-btn-info">
            <div class="badge-number" id="currentSurahNum">1</div>
            <span id="currentSurahTitle">Al-Fatihah</span>
          </div>
          <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div id="juzPickerWrapper" style="display: none; flex: 1; min-width: 200px;">
          <select id="juzSelect" onchange="onJuzChange(this.value)" class="search-input" style="height: 100%; border-radius: 18px; font-weight:700;">
          </select>
        </div>
      </div>
    </div>

    <!-- Sticky Audio Control Hub with Speed Bar -->
    <div class="audio-hub">
      <div class="audio-hub-top">
        <div class="audio-info">
          <div class="audio-icon">
            <i class="fa-solid fa-sliders"></i>
          </div>
          <div class="audio-text">
            <h4 id="activeQariName">Mishary Rashid Alafasy</h4>
            <p id="audioStatusText">Ready to recite</p>
          </div>
        </div>
        <div class="audio-actions">
          <button class="play-main-btn" id="mainPlayPauseBtn" onclick="toggleAudioPlayback()">
            <i class="fa-solid fa-play" id="mainPlayIcon"></i>
          </button>
        </div>
      </div>

      <!-- Recitation Speed Control Strip -->
      <div class="speed-control-strip">
        <span class="speed-label"><i class="fa-solid fa-gauge-high"></i> Speed: <span id="speedValText">1.0x</span></span>
        <div class="speed-chips">
          <button class="speed-chip" onclick="setPlaybackSpeed(0.5)">0.5x</button>
          <button class="speed-chip" onclick="setPlaybackSpeed(0.75)">0.75x</button>
          <button class="speed-chip active" id="speedChip1" onclick="setPlaybackSpeed(1.0)">1.0x</button>
          <button class="speed-chip" onclick="setPlaybackSpeed(1.25)">1.25x</button>
          <button class="speed-chip" onclick="setPlaybackSpeed(1.5)">1.5x</button>
        </div>
      </div>
    </div>

    <!-- Verses Header -->
    <div class="verses-header">
      <h3 id="sectionTitle">Read & Learn</h3>
      <span class="count-chip" id="ayahCountChip">0 Ayahs</span>
    </div>

    <div id="versesContainer"></div>
  </div>

  <!-- Surah Modal -->
  <div class="modal-overlay" id="surahModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Select Surah</h3>
        <button class="icon-btn" style="color: var(--text-dark);" onclick="closeModal('surahModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="text" id="surahSearchInput" class="search-input" placeholder="Search Surah by name or number..." oninput="filterSurahs()">
        <div id="surahListContainer"></div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Settings & Speed</h3>
        <button class="icon-btn" style="color: var(--text-dark);" onclick="closeModal('settingsModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>Select Reciter (Qari)</label>
          <select id="qariSelect" onchange="changeQari(this.value)">
            <option value="ar.alafasy">Mishary Rashid Alafasy</option>
            <option value="ar.abdulbasitmurattal">Abdul Basit Abdul Samad</option>
            <option value="ar.saoodshuraym">Saad Al-Ghamdi / Shuraym</option>
            <option value="ar.hudhaify">Ali Al-Hudhaify</option>
            <option value="ar.shaatree">Abu Bakr Al Shatri</option>
          </select>
        </div>

        <div class="setting-group">
          <label>Recitation Speed: <span id="modalSpeedVal">1.0</span>x</label>
          <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.05" value="1.0" oninput="setPlaybackSpeed(this.value)">
        </div>

        <div class="setting-group">
          <label>Arabic Font Style</label>
          <select id="fontSelect" onchange="changeFontFamily(this.value)">
            <option value="'Amiri', serif">Amiri</option>
            <option value="'Scheherazade New', serif">Scheherazade New</option>
            <option value="'Lateef', cursive">Lateef</option>
          </select>
        </div>

        <div class="setting-group">
          <label>Arabic Font Size (<span id="fontSizeVal">36</span>px)</label>
          <input type="range" id="fontSizeRange" min="20" max="48" value="36" oninput="changeFontSize(this.value)">
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.alquran.cloud/v1';

    let state = {
      selectMode: 'surah',
      selectedSurah: 1,
      selectedJuz: 1,
      selectedQari: 'ar.alafasy',
      playbackMode: 'full',
      playbackSpeed: 1.0, // Default Recitation Speed
      fontSize: 36,
      fontFamily: "'Amiri', serif",
      starCount: 12,
      showBookmarksOnly: false,
      bookmarkedAyahs: new Set(),
      surahList: [],
      currentAyahs: [],
      audioQueue: [],
      currentAudioIndex: -1,
      isPlaying: false
    };

    const audioPlayer = new Audio();

    const versesContainer = document.getElementById('versesContainer');
    const mainPlayIcon = document.getElementById('mainPlayIcon');
    const audioStatusText = document.getElementById('audioStatusText');

    window.addEventListener('DOMContentLoaded', () => {
      populateJuzDropdown();
      fetchSurahList();
      loadContent();
      setupAudioListeners();
    });

    function setupAudioListeners() {
      audioPlayer.addEventListener('ended', () => {
        if (state.playbackMode === 'full' && state.currentAudioIndex < state.audioQueue.length - 1) {
          state.currentAudioIndex++;
          playCurrentQueueIndex();
        } else {
          stopAudioPlayback();
        }
      });

      audioPlayer.addEventListener('error', () => {
        audioStatusText.textContent = "Audio unavailable";
        stopAudioPlayback();
      });
    }

    function setPlaybackSpeed(speedVal) {
      const speed = parseFloat(speedVal);
      state.playbackSpeed = speed;
      audioPlayer.playbackRate = speed;

      document.getElementById('speedValText').textContent = `${speed.toFixed(2)}x`;
      document.getElementById('modalSpeedVal').textContent = speed.toFixed(2);
      document.getElementById('speedSlider').value = speed;

      document.querySelectorAll('.speed-chip').forEach(chip => {
        const chipSpeed = parseFloat(chip.textContent);
        chip.classList.toggle('active', Math.abs(chipSpeed - speed) < 0.01);
      });
    }

    function populateJuzDropdown() {
      const juzSelect = document.getElementById('juzSelect');
      juzSelect.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Para / Juz ${i}`;
        juzSelect.appendChild(opt);
      }
    }

    async function fetchSurahList() {
      try {
        const res = await fetch(`${API_BASE}/surah`);
        const data = await res.json();
        if (data.code === 200) {
          state.surahList = data.data;
          renderSurahListModal(state.surahList);
        }
      } catch (err) {
        console.error("Failed to load Surahs:", err);
      }
    }

    async function loadContent() {
      stopAudioPlayback();
      versesContainer.innerHTML = `
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>Loading Holy Quran verses...</p>
        </div>
      `;

      try {
        const endpoint = state.selectMode === 'juz' 
          ? `${API_BASE}/juz/${state.selectedJuz}/${state.selectedQari}`
          : `${API_BASE}/surah/${state.selectedSurah}/${state.selectedQari}`;

        const res = await fetch(endpoint);
        const data = await res.json();

        if (data.code === 200) {
          const rawData = data.data;
          state.currentAyahs = rawData.ayahs || [];
          
          if (state.selectMode === 'surah') {
            document.getElementById('currentSurahNum').textContent = rawData.number;
            document.getElementById('currentSurahTitle').textContent = rawData.englishName;
            document.getElementById('sectionTitle').textContent = `${rawData.englishName} (${rawData.name})`;
          } else {
            document.getElementById('sectionTitle').textContent = `Para / Juz ${state.selectedJuz}`;
          }

          document.getElementById('ayahCountChip').textContent = `${state.currentAyahs.length} Ayahs`;
          renderVerses();
        } else {
          throw new Error("Invalid API Response");
        }
      } catch (err) {
        versesContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-wifi"></i>
            <p>Could not load Quran verses. Please check your internet connection and try again.</p>
          </div>
        `;
      }
    }

    function renderVerses() {
      const filtered = state.showBookmarksOnly 
        ? state.currentAyahs.filter(a => state.bookmarkedAyahs.has(getAyahKey(a)))
        : state.currentAyahs;

      if (filtered.length === 0) {
        versesContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-bookmark"></i>
            <p>${state.showBookmarksOnly ? 'No saved verses in this section.' : 'No verses found.'}</p>
          </div>
        `;
        return;
      }

      versesContainer.innerHTML = filtered.map(ayah => {
        const key = getAyahKey(ayah);
        const isBookmarked = state.bookmarkedAyahs.has(key);
        const surahName = ayah.surah ? ayah.surah.englishName : (state.surahList[state.selectedSurah - 1]?.englishName || '');
        const ayahNum = ayah.numberInSurah || ayah.number;

        return `
          <div class="ayah-card" id="ayah-card-${key}">
            <div class="ayah-card-header">
              <div class="ayah-meta">
                <div class="ayah-number">${ayahNum}</div>
                <div class="ayah-title">${surahName}</div>
                <span class="reciting-now-badge"><i class="fa-solid fa-volume-high"></i> NOW RECITING</span>
              </div>
              <div class="ayah-actions">
                <button class="ayah-action-btn" title="Play verse" onclick="playSingleAyah('${key}')">
                  <i class="fa-solid fa-circle-play"></i>
                </button>
                <button class="ayah-action-btn ${isBookmarked ? 'bookmarked' : ''}" title="Bookmark" onclick="toggleBookmark('${key}')">
                  <i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-bookmark"></i>
                </button>
              </div>
            </div>
            <div class="arabic-text" style="font-size: ${state.fontSize}px; font-family: ${state.fontFamily};">
              ${ayah.text} ۞
            </div>
          </div>
        `;
      }).join('');
    }

    function getAyahKey(ayah) {
      const surahNum = ayah.surah ? ayah.surah.number : state.selectedSurah;
      const ayahNum = ayah.numberInSurah || ayah.number;
      return `${surahNum}:${ayahNum}`;
    }

    function toggleAudioPlayback() {
      if (state.isPlaying) {
        pauseAudioPlayback();
      } else {
        if (state.audioQueue.length === 0 || state.currentAudioIndex === -1) {
          startFullRecitation();
        } else {
          audioPlayer.play();
          state.isPlaying = true;
          updatePlaybackUI(true);
        }
      }
    }

    function startFullRecitation() {
      state.audioQueue = [...state.currentAyahs];
      state.currentAudioIndex = 0;
      if (state.audioQueue.length > 0) {
        playCurrentQueueIndex();
      }
    }

    function playSingleAyah(key) {
      const index = state.currentAyahs.findIndex(a => getAyahKey(a) === key);
      if (index !== -1) {
        state.audioQueue = [state.currentAyahs[index]];
        state.currentAudioIndex = 0;
        playCurrentQueueIndex();
      }
    }

    function playCurrentQueueIndex() {
      if (state.currentAudioIndex < 0 || state.currentAudioIndex >= state.audioQueue.length) return;

      const currentAyah = state.audioQueue[state.currentAudioIndex];
      const key = getAyahKey(currentAyah);

      audioPlayer.src = currentAyah.audio;
      audioPlayer.playbackRate = state.playbackSpeed; // Ensure speed is applied
      
      audioPlayer.play().then(() => {
        state.isPlaying = true;
        updatePlaybackUI(true);
        highlightAndScrollToAyah(key);
      }).catch(err => {
        console.error("Audio playback error:", err);
      });
    }

    function pauseAudioPlayback() {
      audioPlayer.pause();
      state.isPlaying = false;
      updatePlaybackUI(false);
    }

    function stopAudioPlayback() {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      state.isPlaying = false;
      state.currentAudioIndex = -1;
      updatePlaybackUI(false);
      document.querySelectorAll('.ayah-card').forEach(card => card.classList.remove('active-verse'));
    }

    function updatePlaybackUI(playing) {
      if (playing) {
        mainPlayIcon.className = 'fa-solid fa-pause';
        audioStatusText.textContent = `Reciting (${state.playbackSpeed}x)...`;
      } else {
        mainPlayIcon.className = 'fa-solid fa-play';
        audioStatusText.textContent = 'Paused';
      }
    }

    function highlightAndScrollToAyah(key) {
      document.querySelectorAll('.ayah-card').forEach(card => card.classList.remove('active-verse'));
      const targetCard = document.getElementById(`ayah-card-${key}`);
      if (targetCard) {
        targetCard.classList.add('active-verse');
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function setSelectMode(mode) {
      state.selectMode = mode;
      document.getElementById('modeSurahBtn').classList.toggle('active', mode === 'surah');
      document.getElementById('modeJuzBtn').classList.toggle('active', mode === 'juz');
      document.getElementById('surahPickerBtn').style.display = mode === 'surah' ? 'flex' : 'none';
      document.getElementById('juzPickerWrapper').style.display = mode === 'juz' ? 'block' : 'none';
      loadContent();
    }

    function setPlaybackMode(mode) {
      state.playbackMode = mode;
      document.getElementById('playSingleBtn').classList.toggle('active', mode === 'single');
      document.getElementById('playFullBtn').classList.toggle('active', mode === 'full');
    }

    function onJuzChange(val) {
      state.selectedJuz = parseInt(val, 10);
      loadContent();
    }

    function rewardStar() {
      state.starCount++;
      document.getElementById('starCount').textContent = `${state.starCount} Stars`;
    }

    function toggleBookmark(key) {
      if (state.bookmarkedAyahs.has(key)) {
        state.bookmarkedAyahs.delete(key);
      } else {
        state.bookmarkedAyahs.add(key);
        rewardStar();
      }
      renderVerses();
    }

    function toggleBookmarksOnly() {
      state.showBookmarksOnly = !state.showBookmarksOnly;
      document.getElementById('bookmarkFilterBtn').classList.toggle('active', state.showBookmarksOnly);
      renderVerses();
    }

    function renderSurahListModal(list) {
      const container = document.getElementById('surahListContainer');
      container.innerHTML = list.map(surah => `
        <div class="list-item" onclick="selectSurah(${surah.number})">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="badge-number">${surah.number}</div>
            <div>
              <div style="font-weight:700;">${surah.englishName}</div>
              <div style="font-size:12px; color:var(--text-muted);">${surah.englishNameTranslation}</div>
            </div>
          </div>
          <div style="font-family:var(--font-arabic); font-size:20px; font-weight:bold; color:var(--primary);">${surah.name}</div>
        </div>
      `).join('');
    }

    function filterSurahs() {
      const q = document.getElementById('surahSearchInput').value.toLowerCase();
      const filtered = state.surahList.filter(s => 
        s.englishName.toLowerCase().includes(q) || 
        s.number.toString().includes(q) ||
        s.name.includes(q)
      );
      renderSurahListModal(filtered);
    }

    function selectSurah(num) {
      state.selectedSurah = num;
      closeModal('surahModal');
      loadContent();
    }

    function changeQari(qari) {
      state.selectedQari = qari;
      const qariNames = {
        'ar.alafasy': 'Mishary Rashid Alafasy',
        'ar.abdulbasitmurattal': 'Abdul Basit (Murattal)',
        'ar.saoodshuraym': 'Saad Al-Ghamdi / Shuraym',
        'ar.hudhaify': 'Ali Al-Hudhaify',
        'ar.shaatree': 'Abu Bakr Al Shatri'
      };
      document.getElementById('activeQariName').textContent = qariNames[qari] || 'Reciter';
      loadContent();
    }

    function changeFontSize(val) {
      state.fontSize = val;
      document.getElementById('fontSizeVal').textContent = val;
      document.querySelectorAll('.arabic-text').forEach(el => el.style.fontSize = `${val}px`);
    }

    function changeFontFamily(font) {
      state.fontFamily = font;
      document.querySelectorAll('.arabic-text').forEach(el => el.style.fontFamily = font);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }


    // Progressive Web App installation support for GitHub Pages.
    let deferredInstallPrompt = null;
    const installAppButton = document.getElementById('installAppBtn');

    function isAppInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function refreshInstallButton() {
      if (!installAppButton) return;
      if (isAppInstalled()) {
        installAppButton.style.display = 'none';
      } else {
        installAppButton.style.display = 'inline-flex';
        const label = installAppButton.querySelector('span');
        if (label) label.textContent = deferredInstallPrompt ? 'Install App' : 'Add to Phone';
      }
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      refreshInstallButton();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      refreshInstallButton();
      if (typeof audioStatusText !== 'undefined' && audioStatusText) {
        audioStatusText.textContent = 'Kids Quran installed successfully';
      }
    });

    async function installKidsQuran() {
      if (isAppInstalled()) {
        alert('Kids Quran is already installed on this device.');
        refreshInstallButton();
        return;
      }
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        try { await deferredInstallPrompt.userChoice; } catch (e) {}
        deferredInstallPrompt = null;
        refreshInstallButton();
        return;
      }
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        alert('To install Kids Quran on iPhone/iPad:\n1. Open this website in Safari.\n2. Tap the Share button.\n3. Choose “Add to Home Screen”.\n4. Tap Add.');
      } else {
        alert('To install Kids Quran:\n1. Open this website using Chrome or Edge.\n2. Open the browser menu (⋮).\n3. Choose “Install app” or “Add to Home screen”.\n\nIf the option is missing, wait for the website to finish loading and make sure you are using the HTTPS GitHub Pages link.');
      }
    }

    // Register the service worker only on HTTPS (GitHub Pages) or localhost.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((error) => {
          console.warn('PWA service worker registration failed:', error);
        });
      });
    }
    window.addEventListener('load', refreshInstallButton);
    window.matchMedia('(display-mode: standalone)').addEventListener?.('change', refreshInstallButton);

  </script>
</body>
</html>
